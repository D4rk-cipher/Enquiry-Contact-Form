# ============================================================
# Contact Form Bot - Configuration
# Edit this file with your details before running
# ============================================================

# Your personal / company profile (used to fill forms)
profile:
  first_name: "John"
  last_name: "Doe"
  full_name: "John Doe"          # used when form has a single Name field
  email: "john.doe@yourcompany.com"
  phone: "+1 555 123 4567"
  company: "Your Company Name"
  website: "https://yourcompany.com"
  job_title: ""                  # optional

# Default message (fallback if no template selected)
default_message: |
  Hi,

  I came across your website and wanted to reach out regarding a potential collaboration / service that may be useful for your business.

  Would you be open to a short conversation?

  Best regards,
  John Doe
  Your Company Name

# Prefer file-based templates in data/templates/*.txt
# (real_estate, investments, equity, general, etc.)

# Browser & runtime settings
settings:
  headless: false                # set true for fully background runs
  timeout_ms: 30000              # page load / action timeout
  delay_between_domains_sec: 10  # base delay (jitter added automatically)
  max_retries_per_domain: 1
  screenshot_on_success_only: true   # only screenshot when filled/submitted
  user_agent: null               # null = Playwright default; or set a realistic one

# Common contact page paths to try (in order)
contact_paths:
  - /contact
  - /contact-us
  - /contactus
  - /get-in-touch
  - /getintouch
  - /about/contact
  - /about-us/contact
  - /en/contact
  - /en/contact-us
  - /reach-us
  - /connect
  - /support
  - /help/contact

# Words that strongly suggest a contact page (used when scanning nav)
contact_keywords:
  - contact
  - get in touch
  - reach us
  - reach out
  - enquire
  - inquiry
  - enquire now
  - talk to us
  - connect with us
